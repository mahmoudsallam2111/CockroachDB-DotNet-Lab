global
    maxconn 4096

# Docker's built-in DNS server. HAProxy re-resolves roach1/2/3 through it
# at runtime, so it follows containers when their IP addresses change.
resolvers docker
    nameserver dns1 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold valid    5s
    hold other    5s
    hold refused  5s
    hold nx       5s
    hold timeout  5s
    hold obsolete 5s

defaults
    mode tcp
    timeout connect 5s
    timeout client  30m
    timeout server  30m
    option  clitcpka

# SQL load balancer: the app connects here (localhost:26000)
listen cockroach-sql
    bind :26000
    balance roundrobin
    option httpchk
    http-check send meth GET uri /health?ready=1
    # resolvers docker   -> look up the current IP via Docker DNS
    # init-addr ... none -> start even if a node's name cannot be resolved yet
    default-server inter 2s fall 2 rise 2 resolvers docker init-addr last,libc,none
    server roach1 roach1:26257 check port 8080
    server roach2 roach2:26257 check port 8080
    server roach3 roach3:26257 check port 8080

# Stats page: http://localhost:8404
listen stats
    bind :8404
    mode http
    stats enable
    stats uri /
    stats refresh 2s
